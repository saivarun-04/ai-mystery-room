<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0B1020"/>
      <stop offset="100%" style="stop-color:#161B2B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bg)"/>

  <!-- Magnifying glass icon (left) -->
  <circle cx="90" cy="100" r="38" fill="none" stroke="#C9A24B" stroke-width="3.5"/>
  <line x1="117" y1="127" x2="148" y2="158" stroke="#C9A24B" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="90" cy="100" r="22" fill="none" stroke="#6B1F2A" stroke-width="1.5" opacity="0.6"/>
  <circle cx="90" cy="100" r="12" fill="#6B1F2A" opacity="0.25"/>

  <!-- Title -->
  <text x="160" y="86" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="44" fill="#E9E1CF" font-weight="bold" letter-spacing="1">
    AI Mystery Room
  </text>

  <!-- Subtitle -->
  <text x="160" y="122" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="14" fill="#C9A24B" letter-spacing="3">
    A CINEMATIC NOIR DETECTIVE GAME
  </text>

  <!-- Divider line -->
  <line x1="160" y1="142" x2="460" y2="142" stroke="#6B1F2A" stroke-width="1.5"/>

  <!-- Tagline -->
  <text x="160" y="168" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="13" fill="#E9E1CF" opacity="0.65" letter-spacing="1">
    Investigate • Discover • Accuse
  </text>

  <!-- Right side: Case file panel -->
  <rect x="570" y="42" width="210" height="116" fill="#0B1020" stroke="#6B1F2A" stroke-width="1.5" rx="3" opacity="0.9"/>
  <text x="588" y="72" font-family="'Inter', sans-serif" font-size="11" fill="#C9A24B" letter-spacing="2" font-weight="bold">
    CLASSIFIED
  </text>
  <line x1="588" y1="82" x2="750" y2="82" stroke="#6B1F2A" stroke-width="1" opacity="0.5"/>
  <text x="588" y="105" font-family="'Inter', sans-serif" font-size="11" fill="#E9E1CF" opacity="0.7">
    CASE FILE #001
  </text>
  <text x="588" y="127" font-family="'Inter', sans-serif" font-size="11" fill="#E9E1CF" opacity="0.7">
    DIFFICULTY: ★★★
  </text>
  <text x="588" y="149" font-family="'Inter', sans-serif" font-size="11" fill="#E9E1CF" opacity="0.7">
    SUSPECTS: 5
  </text>
</svg>
